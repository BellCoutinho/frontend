<div class="auth-page">
  <div class="auth-card-wrapper">
    <pd-card>
      <div class="auth-logo">
        <svg width="32" height="32" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="8" fill="#8b5cf6"/>
          <path d="M10 26V14l8-6 8 6v12H22v-7h-4v7H10z" fill="white"/>
        </svg>
        <span>MeuAcervo</span>
      </div>

      <div class="forgot-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 11c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
      </div>

      <h2>Recuperar senha</h2>
      <p class="auth-subtitle">
        Informe seu e-mail e enviaremos as instruções para redefinir sua senha.
      </p>

      <app-alert-message
        *ngIf="errorMessage"
        type="error"
        [message]="errorMessage"
        (dismissed)="errorMessage=''"
      ></app-alert-message>
      <app-alert-message
        *ngIf="successMessage"
        type="success"
        [message]="successMessage"
        [dismissible]="false"
      ></app-alert-message>

      <form *ngIf="!successMessage" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <pd-input
          id="email"
          label="E-mail cadastrado"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          autocomplete="email"
          [required]="true"
          [error]="getEmailError()"
        ></pd-input>

        <div style="margin-top: 20px;">
          <pd-button
            type="submit"
            variant="primary"
            [fullWidth]="true"
            [loading]="loading"
          >
            Enviar instruções
          </pd-button>
        </div>
      </form>

      <div class="auth-footer">
        <a routerLink="/auth/login">← Voltar ao login</a>
      </div>
    </pd-card>
  </div>
</div>
